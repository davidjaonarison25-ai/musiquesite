<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Site de Musique</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }
    h1 {
      margin-bottom: 25px;
    }
    
    /* Boutons de filtres */
    .filter-menu {
      margin-bottom: 30px;
    }
    .btn-filter {
      background-color: #282828;
      color: white;
      border: 1px solid #333;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
    }
    .btn-filter:hover, .btn-filter.active {
      background-color: #1db954;
      color: white;
      border-color: #1db954;
    }

    /* Grille des sons */
    .music-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      width: 300px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .genre-tag {
      display: inline-block;
      background-color: #333;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 12px;
      margin-bottom: 10px;
      color: #1db954;
      font-weight: bold;
    }
    audio {
      width: 100%;
      margin: 15px 0;
    }
    .btn-download {
      display: inline-block;
      background-color: #1db954;
      color: white;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 20px;
      font-weight: bold;
      transition: transform 0.2s;
    }
    .btn-download:hover {
      transform: scale(1.05);
      background-color: #1ed760;
    }
  </style>
</head>
<body>

  <h1>🎵 Écouter et Télécharger</h1>

  <!-- Menu de sélection des genres -->
  <div class="filter-menu">
    <button class="btn-filter active" onclick="filterMusic('all')">Tous</button>
    <button class="btn-filter" onclick="filterMusic('funk')">Funk</button>
    <button class="btn-filter" onclick="filterMusic('pop')">Pop</button>
    <button class="btn-filter" onclick="filterMusic('phonk')">Phonk</button>
  </div>

  <!-- Catalogue de musique -->
  <div class="music-container">

    <!-- Morceau 1 : Funk -->
    <div class="card music-item funk">
      <span class="genre-tag">FUNK</span>
      <h3>Titre Funk 1</h3>
      <audio controls>
        <source src="funk1.mp3" type="audio/mpeg">
      </audio>
      <br><br>
      <a href="funk1.mp3" download class="btn-download">Télécharger MP3</a>
    </div>

    <!-- Morceau 2 : Pop -->
    <div class="card music-item pop">
      <span class="genre-tag">POP</span>
      <h3>Titre Pop 1</h3>
      <audio controls>
        <source src="pop1.mp3" type="audio/mpeg">
      </audio>
      <br><br>
      <a href="pop1.mp3" download class="btn-download">Télécharger MP3</a>
    </div>

    <!-- Morceau 3 : Phonk -->
    <div class="card music-item phonk">
      <span class="genre-tag">PHONK</span>
      <h3>Titre Phonk 1</h3>
      <audio controls>
        <source src="phonk1.mp3" type="audio/mpeg">
      </audio>
      <br><br>
      <a href="phonk1.mp3" download class="btn-download">Télécharger MP3</a>
    </div>

  </div>

  <!-- Script pour faire fonctionner le filtrage -->
  <script>
    function filterMusic(genre) {
      const items = document.querySelectorAll('.music-item');
      const buttons = document.querySelectorAll('.btn-filter');

      // Gestion du bouton actif
      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      // Filtrage des éléments
      items.forEach(item => {
        if (genre === 'all' || item.classList.contains(genre)) {
          item.style.display = 'block';
        } else {
          item.style.display = 'none';
        }
      });
    }
  </script>

</body>
</html>
