<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passfoot 🎮 - Puppet Soccer 1v1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #040d1a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    h1 { color: #00f0ff; text-shadow: 0 0 10px #00f0ff; margin-bottom: 10px; text-transform: uppercase; }
    
    .scoreboard {
      display: flex; justify-content: space-between; width: 800px; background: #0a192f;
      padding: 10px 20px; border: 2px solid #00f0ff; border-bottom: none; border-radius: 12px 12px 0 0;
      font-size: 1.5rem; font-weight: bold; color: #00f0ff;
    }
    
    canvas {
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 70%, #064e3b 70%, #022c22 100%);
      border: 2px solid #00f0ff; box-shadow: 0 0 20px rgba(0,240,255,0.3); border-radius: 0 0 12px 12px;
    }
    
    .controls-hint { margin-top: 15px; color: #94a3b8; font-size: 0.9rem; text-align: center; }
    .controls-hint span { color: #00f0ff; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Puppet Soccer 1v1 ⚽</h1>
  
  <div class="scoreboard">
    <div style="color: #38bdf8;">J1: <span id="score1">0</span></div>
    <div style="color: #f59e0b;">⏱️ <span id="timer">60</span>s</div>
    <div style="color: #ef4444;">IA: <span id="score2">0</span></div>
  </div>

  <canvas id="gameCanvas" width="800" height="400"></canvas>

  <div class="controls-hint">
    Contrôles : <span>← / →</span> Déplacer | <span>↑</span> Sauter | <span>ESPACE</span> Tirer
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Moteur & Règles
    const gravity = 0.45;
    const groundY = 350;
    let score1 = 0, score2 = 0, timeLeft = 60;
    let gameOver = false;

    // Timer
    const timerInt = setInterval(() => {
      if(timeLeft > 0 && !gameOver) {
        timeLeft--;
        document.getElementById('timer').textContent = timeLeft;
      } else if(timeLeft === 0) {
        gameOver = true;
        alert(`Fin du match ! Score : ${score1} - ${score2}`);
        clearInterval(timerInt);
      }
    }, 1000);

    // Joueurs (Style Puppet / Big Head)
    const p1 = { x: 150, y: 250, vx: 0, vy: 0, size: 28, headSize: 22, color: '#38bdf8', isGrounded: false };
    const p2 = { x: 610, y: 250, vx: 0, vy: 0, size: 28, headSize: 22, color: '#ef4444', isGrounded: false };

    // Ballon
    const ball = { x: 400, y: 150, vx: 0, vy: 0, radius: 14, bounce: 0.75 };

    // Clavier
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function resetPositions() {
      p1.x = 150; p1.y = 250; p1.vx = 0; p1.vy = 0;
      p2.x = 610; p2.y = 250; p2.vx = 0; p2.vy = 0;
      ball.x = 400; ball.y = 150; ball.vx = 0; ball.vy = 0;
    }

    function update() {
      if(gameOver) return;

      // Déplacements J1
      if (keys['ArrowLeft']) p1.vx = -5;
      else if (keys['ArrowRight']) p1.vx = 5;
      else p1.vx = 0;

      if (keys['ArrowUp'] && p1.isGrounded) { p1.vy = -11; p1.isGrounded = false; }

      // IA Simple pour J2
      if (ball.x > 350) {
        if (ball.x > p2.x + 10) p2.vx = 3.5;
        else if (ball.x < p2.x - 10) p2.vx = -3.5;
        else p2.vx = 0;

        if (ball.y < p2.y - 30 && p2.isGrounded && Math.abs(ball.x - p2.x) < 40) {
          p2.vy = -10; p2.isGrounded = false;
        }
      } else {
        if (p2.x < 620) p2.vx = 3; else p2.vx = 0;
      }

      // Gravité & Physique
      [p1, p2].forEach(p => {
        p.vy += gravity;
        p.x += p.vx;
        p.y += p.vy;

        if (p.y + p.size >= groundY) {
          p.y = groundY - p.size;
          p.vy = 0;
          p.isGrounded = true;
        }
        // Limites terrain
        if (p.x - p.size < 0) p.x = p.size;
        if (p.x + p.size > canvas.width) p.x = canvas.width - p.size;
      });

      // Physique Ballon
      ball.vy += gravity * 0.7;
      ball.x += ball.vx;
      ball.y += ball.vy;
      ball.vx *= 0.99; // frotte l'air

      // Rebond Sol
      if (ball.y + ball.radius >= groundY) {
        ball.y = groundY - ball.radius;
        ball.vy = -ball.vy * ball.bounce;
      }
      // Mur gauche / droit
      if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
        ball.vx = -ball.vx * ball.bounce;
      }

      // Collisions Joueurs <-> Ballon
      [p1, p2].forEach(p => {
        let dx = ball.x - p.x;
        let dy = ball.y - (p.y - p.headSize); // collision centrée entre tête et corps
        let dist = Math.hypot(dx, dy);
        let minDist = ball.radius + p.size;

        if (dist < minDist) {
          let angle = Math.atan2(dy, dx);
          let power = 9;
          ball.vx = Math.cos(angle) * power + p.vx * 0.5;
          ball.vy = Math.sin(angle) * power + p.vy * 0.5;
        }
      });

      // Frappe / Coup de pied J1 (Touche Espace)
      if (keys['Space']) {
        let dx = ball.x - p1.x;
        let dy = ball.y - p1.y;
        if (Math.hypot(dx, dy) < 65) {
          ball.vx = 12;
          ball.vy = -6;
        }
      }

      // GESTION DES BUTS (Cages aux extrémités)
      if (ball.y > 230 && ball.y <= groundY) {
        // But Gauche (Marqué par IA)
        if (ball.x - ball.radius <= 50) {
          score2++;
          document.getElementById('score2').textContent = score2;
          resetPositions();
        }
        // But Droit (Marqué par J1)
        if (ball.x + ball.radius >= 750) {
          score1++;
          document.getElementById('score1').textContent = score1;
          resetPositions();
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Cages de But (Filets Néon)
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#00f0ff';
      // Cage Gauche
      ctx.strokeRect(0, 220, 50, 130);
      // Cage Droite
      ctx.strokeRect(750, 220, 50, 130);

      // Dessin des Joueurs (Style Puppet)
      [p1, p2].forEach(p => {
        // Corps
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        // Grosse Tête (Puppet style)
        ctx.fillStyle = '#ffdbac';
        ctx.beginPath();
        ctx.arc(p.x, p.y - p.headSize, p.headSize, 0, Math.PI * 2);
        ctx.fill();

        // Yeux
        ctx.fillStyle = '#000';
        let eyeOffset = p === p1 ? 6 : -6;
        ctx.beginPath();
        ctx.arc(p.x + eyeOffset, p.y - p.headSize - 2, 3, 0, Math.PI * 2);
        ctx.fill();
      });

      // Ballon
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.stroke();

      update();
      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
