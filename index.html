<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passfoot 🎮 - Penalty 3D Pro Master</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: #040d1a; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

    header {
      background: #0a192f; padding: 12px 30px; display: flex;
      justify-content: space-between; align-items: center;
      border-bottom: 2px solid #00f0ff; box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
    }
    .brand h1 { font-size: 1.8rem; color: #00f0ff; text-shadow: 0 0 12px #00f0ff; text-transform: uppercase; }
    .brand p { font-size: 0.75rem; color: #94a3b8; }

    .app-layout { display: flex; flex: 1; padding: 20px; gap: 20px; }
    .sidebar { width: 160px; display: flex; flex-direction: column; gap: 15px; }
    
    .stat-card {
      background: #0f233d; border: 2px solid #00f0ff; border-radius: 12px;
      padding: 12px; text-align: center; color: #00f0ff; font-weight: bold; font-size: 0.8rem;
    }
    .stat-value { font-size: 1.4rem; color: #fff; display: block; margin-top: 4px; }

    .main-area { flex: 1; display: flex; flex-direction: column; gap: 15px; }

    .scoreboard {
      display: flex; justify-content: space-around; background: #081627;
      padding: 12px; border-radius: 10px; font-weight: bold;
      color: #00f0ff; border: 1px solid rgba(0,240,255,0.3);
    }

    #container3D {
      width: 100%; height: 500px; border-radius: 14px;
      border: 2px solid #00f0ff; box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
      overflow: hidden; position: relative; cursor: crosshair;
    }

    .message {
      text-align: center; font-size: 1.2rem; font-weight: bold;
      min-height: 30px; color: #00f0ff; text-shadow: 0 0 10px #00f0ff;
    }

    .controls-hint {
      text-align: center; color: #94a3b8; font-size: 0.85rem; margin-top: 5px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>Passfoot ⚽</h1>
      <p>Mode Penalty 3D Pro</p>
    </div>
  </header>

  <div class="app-layout">
    <div class="sidebar">
      <div class="stat-card" style="border-color: #f59e0b; color: #fbbf24;">
        🪙 COINS<span class="stat-value" id="coins-count">500</span>
      </div>
      <div class="stat-card">
        🔥 BEST SCORE<span class="stat-value" id="high-score">0</span>
      </div>
    </div>

    <div class="main-area">
      <div class="scoreboard">
        <div>Mode: <span style="color:#fff;">Penalty 3D Master</span></div>
        <div>Score: <span id="score-3d" style="color:#fff;">0</span></div>
        <div>Combo: 🔥x<span id="combo-3d" style="color:#fff;">1</span></div>
      </div>

      <div id="container3D"></div>
      <div class="message" id="msg-3d">Clique dans la cage pour ajuster ta frappe !</div>
      <div class="controls-hint">💡 Astuce : Clique dans un angle pour brosser ton ballon et tromper le gardien !</div>
    </div>
  </div>

  <script>
    let coins = parseInt(localStorage.getItem('passcoins')) || 500;
    let highScore = parseInt(localStorage.getItem('passHighScore')) || 0;
    let score3D = 0, combo3D = 1;
    let isShooting = false;

    /* AUDIO SYNTHESIZER */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'kick') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(130, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === 'goal') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
      } else if (type === 'save') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      }
    }

    /* MOTEUR THREE.JS */
    let scene, camera, renderer;
    let ball, keeper, goal;
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();

    function init3D() {
      const container = document.getElementById('container3D');
      container.innerHTML = '';

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x040d1a);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
      camera.position.set(0, 1.7, 9);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // Lumières
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const spotLight = new THREE.SpotLight(0x00f0ff, 1.2);
      spotLight.position.set(0, 12, 6);
      spotLight.castShadow = true;
      scene.add(spotLight);

      // Terrain & Lignes de Penalty
      const pitchGeo = new THREE.PlaneGeometry(20, 24);
      const pitchMat = new THREE.MeshStandardMaterial({ color: 0x061a33, roughness: 0.8 });
      const pitch = new THREE.Mesh(pitchGeo, pitchMat);
      pitch.rotation.x = -Math.PI / 2;
      pitch.receiveShadow = true;
      scene.add(pitch);

      const lineMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
      const penaltyBox = new THREE.Mesh(new THREE.BoxGeometry(10, 0.02, 6), lineMat);
      penaltyBox.position.set(0, 0.01, -2);
      scene.add(penaltyBox);

      const penaltySpot = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.03, 32), lineMat);
      penaltySpot.position.set(0, 0.02, 5.5);
      scene.add(penaltySpot);

      // Cage & Filets
      goal = new THREE.Group();
      const postMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.8, roughness: 0.2 });
      
      const leftPost = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 2.6), postMat);
      leftPost.position.set(-2.6, 1.3, -5);
      
      const rightPost = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 2.6), postMat);
      rightPost.position.set(2.6, 1.3, -5);

      const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 5.36), postMat);
      bar.rotation.z = Math.PI / 2;
      bar.position.set(0, 2.6, -5);

      // Filet arrière
      const netMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true, opacity: 0.25, transparent: true });
      const net = new THREE.Mesh(new THREE.BoxGeometry(5.2, 2.6, 1.5), netMat);
      net.position.set(0, 1.3, -5.75);

      goal.add(leftPost, rightPost, bar, net);
      scene.add(goal);

      // Ballon 3D
      const ballGeo = new THREE.SphereGeometry(0.22, 32, 32);
      const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
      ball = new THREE.Mesh(ballGeo, ballMat);
      ball.position.set(0, 0.22, 5.5);
      ball.castShadow = true;
      scene.add(ball);

      // Gardien 3D Amélioré
      const keeperGroup = new THREE.Group();
      const bodyGeo = new THREE.BoxGeometry(0.75, 1.6, 0.4);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0x550000 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.8;

      const headGeo = new THREE.SphereGeometry(0.25, 16, 16);
      const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc99 });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 1.8;

      keeperGroup.add(body, head);
      keeper = keeperGroup;
      keeper.position.set(0, 0, -4.8);
      scene.add(keeper);

      container.addEventListener('click', onPenaltyClick);
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    function onPenaltyClick(event) {
      if (isShooting) return;

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      const targetX = mouse.x * 3.6;
      const targetY = Math.max(0.3, (mouse.y + 0.6) * 2.3);
      const targetZ = -5;

      playSound('kick');
      shootPenalty(targetX, targetY, targetZ);
    }

    function shootPenalty(tx, ty, tz) {
      isShooting = true;
      const startX = ball.position.x;
      const startY = ball.position.y;
      const startZ = ball.position.z;

      // Déplacement anticipé du gardien
      const keeperTargetX = (Math.random() - 0.5) * 4.8;
      const keeperJumpY = Math.random() > 0.5 ? 0.6 : 0;

      let progress = 0;
      const interval = setInterval(() => {
        progress += 0.035;

        // Brossé / Effet courbe
        const curveEffect = Math.sin(progress * Math.PI) * (tx * 0.4);
        ball.position.x = startX + (tx - startX) * progress + curveEffect;
        ball.position.y = startY + (ty - startY) * progress + Math.sin(progress * Math.PI) * 1.2;
        ball.position.z = startZ + (tz - startZ) * progress;

        // Rotation du ballon
        ball.rotation.x += 0.25;
        ball.rotation.y += 0.15;

        // Plongeon du gardien
        keeper.position.x += (keeperTargetX - keeper.position.x) * 0.12;
        keeper.position.y = keeperJumpY * Math.sin(progress * Math.PI);
        keeper.rotation.z = -keeperTargetX * 0.15;

        if (progress >= 1) {
          clearInterval(interval);
          checkGoal(tx, ty, keeperTargetX, keeperJumpY);
        }
      }, 16);
    }

    function checkGoal(tx, ty, keeperX, keeperY) {
      const msg = document.getElementById('msg-3d');
      const isInside = Math.abs(tx) <= 2.6 && ty <= 2.6 && ty >= 0.2;
      const keeperSaved = Math.abs(tx - keeperX) < 0.85 && Math.abs(ty - (1.0 + keeperY)) < 0.95;

      if (isInside && !keeperSaved) {
        playSound('goal');
        const earnedCoins = 15 * combo3D;
        score3D += 10 * combo3D;
        coins += earnedCoins;
        combo3D++;

        if (score3D > highScore) highScore = score3D;

        msg.textContent = `⚽ GOAAL ! Tir Parfait ! (+${earnedCoins} Coins)`;
      } else if (keeperSaved) {
        playSound('save');
        combo3D = 1;
        msg.textContent = "🖐️ SUPERBE ARRÊT DU GARDIEN !";
      } else {
        combo3D = 1;
        msg.textContent = "❌ TIR HORS CADRE !";
      }

      // Mise à jour de l'UI et sauvegarde
      localStorage.setItem('passcoins', coins);
      localStorage.setItem('passHighScore', highScore);
      document.getElementById('coins-count').textContent = coins;
      document.getElementById('high-score').textContent = highScore;
      document.getElementById('score-3d').textContent = score3D;
      document.getElementById('combo-3d').textContent = combo3D;

      // Réinitialisation du tir
      setTimeout(() => {
        ball.position.set(0, 0.22, 5.5);
        keeper.position.set(0, 0, -4.8);
        keeper.rotation.z = 0;
        isShooting = false;
      }, 1200);
    }

    // Lancement au chargement
    document.getElementById('coins-count').textContent = coins;
    document.getElementById('high-score').textContent = highScore;
    init3D();
  </script>
</body>
</html>
