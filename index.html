<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passfoot Music</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #000;
      color: #fff;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar (Menu de gauche) */
    .sidebar {
      width: 240px;
      background-color: #000;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #1db954;
      margin-bottom: 10px;
    }

    .menu-item {
      color: #b3b3b3;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 8px 0;
      cursor: pointer;
      transition: 0.2s;
    }

    .menu-item:hover, .menu-item.active {
      color: #fff;
    }

    /* Zone Principale */
    .main-content {
      flex: 1;
      background: linear-gradient(to bottom, #1e1e1e, #121212);
      border-radius: 8px;
      margin: 8px 8px 90px 0;
      padding: 24px;
      overflow-y: auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .search-input {
      background-color: #242424;
      border: 1px solid #333;
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      width: 280px;
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: #1db954;
    }

    .header-title {
      font-size: 28px;
      margin-bottom: 20px;
    }

    /* Grille de musiques */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: #181818;
      padding: 16px;
      border-radius: 8px;
      transition: background-color 0.3s ease, transform 0.2s ease;
      cursor: pointer;
      position: relative;
    }

    .card:hover {
      background-color: #282828;
      transform: translateY(-4px);
    }

    .card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 12px;
      background-color: #333;
    }

    .card-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-genre {
      font-size: 12px;
      color: #a7a7a7;
      margin-bottom: 12px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-dl {
      flex: 1;
      text-align: center;
      background-color: #1db954;
      color: #000;
      padding: 8px 0;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 12px;
    }

    .btn-dl:hover {
      background-color: #1ed760;
    }

    .btn-like {
      background: none;
      border: none;
      color: #b3b3b3;
      font-size: 18px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .btn-like.liked {
      color: #1db954;
    }

    /* Lecteur en bas (Player) */
    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background-color: #000;
      border-top: 1px solid #282828;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      box-sizing: border-box;
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 250px;
    }

    .now-playing-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    .now-playing-artist {
      font-size: 12px;
      color: #a7a7a7;
    }

    audio {
      width: 400px;
      height: 40px;
    }
  </style>
</head>
<body>

  <!-- Menu latéral -->
  <div class="sidebar">
    <div class="logo">Passfoot App</div>
    <div class="menu-item active" onclick="filterGenre('all')">🏠 Accueil</div>
    <div class="menu-item" onclick="filterGenre('funk')">🔥 Funk</div>
    <div class="menu-item" onclick="filterGenre('phonk')">⚡ Phonk</div>
    <div class="menu-item" onclick="filterGenre('pop')">🎵 Pop</div>
  </div>

  <!-- Zone de contenu -->
  <div class="main-content">
    <div class="top-bar">
      <h2 class="header-title">Musiques & Beats</h2>
      <input type="text" class="search-input" id="searchInput" onkeyup="searchMusic()" placeholder="🔍 Rechercher un titre ou genre...">
    </div>

    <div class="grid-container">

      <!-- Carte 1 : Funk -->
      <div class="card item-music funk" onclick="playTrack('Montagem Ritmada', 'Brazilian Funk', 'funk1.mp3')">
        <img src="pochette1.jpg" alt="Pochette" onerror="this.src='https://via.placeholder.com/150/181818/1db954?text=Funk'">
        <div class="card-title">Montagem Ritmada</div>
        <div class="card-genre">Brazilian Funk</div>
        <div class="card-actions">
          <a href="funk1.mp3" download class="btn-dl" onclick="event.stopPropagation()">Télécharger</a>
          <button class="btn-like" onclick="toggleLike(this, event)">♥</button>
        </div>
      </div>

      <!-- Carte 2 : Phonk -->
      <div class="card item-music phonk" onclick="playTrack('Imposter Syndrome', 'Phonk', 'phonk1.mp3')">
        <img src="pochette2.jpg" alt="Pochette" onerror="this.src='https://via.placeholder.com/150/181818/1db954?text=Phonk'">
        <div class="card-title">Imposter Syndrome</div>
        <div class="card-genre">Phonk</div>
        <div class="card-actions">
          <a href="phonk1.mp3" download class="btn-dl" onclick="event.stopPropagation()">Télécharger</a>
          <button class="btn-like" onclick="toggleLike(this, event)">♥</button>
        </div>
      </div>

      <!-- Carte 3 : Pop -->
      <div class="card item-music pop" onclick="playTrack('Titre Pop 1', 'Pop', 'pop1.mp3')">
        <img src="pochette3.jpg" alt="Pochette" onerror="this.src='https://via.placeholder.com/150/181818/1db954?text=Pop'">
        <div class="card-title">Titre Pop 1</div>
        <div class="card-genre">Pop</div>
        <div class="card-actions">
          <a href="pop1.mp3" download class="btn-dl" onclick="event.stopPropagation()">Télécharger</a>
          <button class="btn-like" onclick="toggleLike(this, event)">♥</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Barre de lecture Spotify en bas -->
  <div class="player-bar">
    <div class="now-playing">
      <div>
        <div class="now-playing-title" id="currentTitle">Sélectionne un titre</div>
        <div class="now-playing-artist" id="currentGenre">-</div>
      </div>
    </div>

    <!-- Lecteur principal -->
    <audio controls id="mainPlayer">
      <source id="audioSource" src="funk1.mp3" type="audio/mpeg">
    </audio>
  </div>

  <script>
    // Lancer une musique lors du clic sur une carte
    function playTrack(title, genre, src) {
      const player = document.getElementById('mainPlayer');
      const source = document.getElementById('audioSource');
      const titleElem = document.getElementById('currentTitle');
      const genreElem = document.getElementById('currentGenre');

      titleElem.textContent = title;
      genreElem.textContent = genre;
      source.src = src;
      player.load();
      player.play();
    }

    // Filtre des catégories
    function filterGenre(genre) {
      const items = document.querySelectorAll('.item-music');
      const menuItems = document.querySelectorAll('.menu-item');

      menuItems.forEach(item => item.classList.remove('active'));
      event.target.classList.add('active');

      items.forEach(item => {
        if (genre === 'all' || item.classList.contains(genre)) {
          item.style.display = 'block';
        } else {
          item.style.display = 'none';
        }
      });
    }

    // Barre de recherche
    function searchMusic() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const items = document.querySelectorAll('.item-music');

      items.forEach(item => {
        const text = item.textContent.toLowerCase();
        if (text.includes(input)) {
          item.style.display = 'block';
        } else {
          item.style.display = 'none';
        }
      });
    }

    // Bouton de Like
    function toggleLike(btn, event) {
      event.stopPropagation(); // Évite de lancer la musique au clic sur le coeur
      btn.classList.toggle('liked');
    }
  </script>

</body>
</html>
