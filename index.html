<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passfoot Music</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #000;
      color: #fff;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background-color: #000;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #1db954;
      margin-bottom: 10px;
    }

    .menu-item {
      color: #b3b3b3;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 8px 0;
      cursor: pointer;
      transition: 0.2s;
    }

    .menu-item:hover, .menu-item.active {
      color: #fff;
    }

    /* Zone Principale */
    .main-content {
      flex: 1;
      background: linear-gradient(to bottom, #1e1e1e, #121212);
      border-radius: 8px;
      margin: 8px 8px 90px 0;
      padding: 24px;
      overflow-y: auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 15px;
      flex-wrap: wrap;
    }

    .search-input {
      background-color: #242424;
      border: 1px solid #333;
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      width: 250px;
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: #1db954;
    }

    .btn-publish {
      background-color: #1db954;
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn-publish:hover {
      background-color: #1ed760;
      transform: scale(1.05);
    }

    /* Bannière Tendance (Hero Banner) */
    .hero-banner {
      background: linear-gradient(135deg, #1db954 0%, #000000 100%);
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .hero-text h1 {
      font-size: 36px;
      margin-bottom: 10px;
      font-weight: 800;
    }

    .hero-text p {
      color: #e0e0e0;
      font-size: 14px;
      margin-bottom: 20px;
      max-width: 400px;
    }

    .btn-hero-play {
      background-color: #1db954;
      color: #000;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn-hero-play:hover {
      background-color: #1ed760;
      transform: scale(1.05);
    }

    .header-title {
      font-size: 24px;
      margin-bottom: 20px;
    }

    /* Grille de musiques */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: #181818;
      padding: 16px;
      border-radius: 8px;
      transition: background-color 0.3s ease, transform 0.2s ease;
      cursor: pointer;
    }

    .card:hover {
      background-color: #282828;
      transform: translateY(-4px);
    }

    .card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 12px;
      background-color: #333;
    }

    .card-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-genre {
      font-size: 12px;
      color: #a7a7a7;
      margin-bottom: 12px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-dl {
      flex: 1;
      text-align: center;
      background-color: #1db954;
      color: #000;
      padding: 8px 0;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 12px;
    }

    .btn-dl:hover {
      background-color: #1ed760;
    }

    .btn-like {
      background: none;
      border: none;
      color: #b3b3b3;
      font-size: 18px;
      cursor: pointer;
    }

    .btn-like.liked {
      color: #1db954;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal {
      background-color: #181818;
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }

    .modal h3 {
      margin-bottom: 20px;
      color: #1db954;
    }

    .modal input, .modal select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      background: #282828;
      border: 1px solid #333;
      color: white;
      border-radius: 6px;
      outline: none;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-cancel {
      background: #333;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
    }

    /* Player */
    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background-color: #000;
      border-top: 1px solid #282828;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .now-playing-title {
      font-size: 14px;
      font-weight: 600;
    }

    .now-playing-artist {
      font-size: 12px;
      color: #a7a7a7;
    }

    audio {
      width: 400px;
      height: 40px;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">Passfoot App</div>
    <div class="menu-item active" onclick="filterGenre('all')">🏠 Accueil</div>
    <div class="menu-item" onclick="filterGenre('funk')">🔥 Funk</div>
    <div class="menu-item" onclick="filterGenre('phonk')">⚡ Phonk</div>
    <div class="menu-item" onclick="filterGenre('pop')">🎵 Pop</div>
  </div>

  <!-- Zone de contenu -->
  <div class="main-content">
    <div class="top-bar">
      <input type="text" class="search-input" id="searchInput" onkeyup="searchMusic()" placeholder="🔍 Rechercher...">
      <button class="btn-publish" onclick="openModal()">➕ Publier une musique</button>
    </div>

    <!-- Bannière Tendance -->
    <div class="hero-banner" id="heroBanner">
      <div class="hero-text">
        <span style="font-size: 12px; font-weight: bold; letter-spacing: 1px; color: #fff; text-transform: uppercase;">🔥 Titre du Moment</span>
        <h1>Montagem Ritmada</h1>
        <p>Le meilleur du Brazilian Funk à écouter et télécharger en HD.</p>
        <button class="btn-hero-play" onclick="playTrack('Montagem Ritmada', 'Brazilian Funk', 'funk1.mp3')">▶ Écouter maintenant</button>
      </div>
    </div>

    <h2 class="header-title">Toutes les musiques</h2>

    <div class="grid-container" id="musicContainer">

      <!-- Carte 1 -->
      <div class="card item-music funk" onclick="playTrack('Montagem Ritmada', 'Brazilian Funk', 'funk1.mp3')">
        <img src="pochette1.jpg" alt="Pochette" onerror="this.src='https://via.placeholder.com/150/181818/1db954?text=Funk'">
        <div class="card-title">Montagem Ritmada</div>
        <div class="card-genre">Brazilian Funk</div>
        <div class="card-actions">
          <a href="funk1.mp3" download class="btn-dl" onclick="event.stopPropagation()">Télécharger</a>
          <button class="btn-like" onclick="toggleLike(this, event)">♥</button>
        </div>
      </div>

      <!-- Carte 2 -->
      <div class="card item-music phonk" onclick="playTrack('Imposter Syndrome', 'Phonk', 'phonk1.mp3')">
        <img src="pochette2.jpg" alt="Pochette" onerror="this.src='https://via.placeholder.com/150/181818/1db954?text=Phonk'">
        <div class="card-title">Imposter Syndrome</div>
        <div class="card-genre">Phonk</div>
        <div class="card-actions">
          <a href="phonk1.mp3" download class="btn-dl" onclick="event.stopPropagation()">Télécharger</a>
          <button class="btn-like" onclick="toggleLike(this, event)">♥</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>Publier un morceau</h3>
      <input type="text" id="trackTitle" placeholder="Titre du morceau" required>
      <select id="trackGenre">
        <option value="funk">Funk</option>
        <option value="phonk">Phonk</option>
        <option value="pop">Pop</option>
      </select>
      <label style="font-size: 12px; color: #aaa;">Fichier Audio (MP3) :</label>
      <input type="file" id="trackFile" accept="audio/*" required>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeModal()">Annuler</button>
        <button class="btn-publish" onclick="addMusic()">Ajouter</button>
      </div>
    </div>
  </div>

  <!-- Player -->
  <div class="player-bar">
    <div>
      <div class="now-playing-title" id="currentTitle">Sélectionne un titre</div>
      <div class="now-playing-artist" id="currentGenre">-</div>
    </div>

    <audio controls id="mainPlayer">
      <source id="audioSource" src="" type="audio/mpeg">
    </audio>
  </div>

  <script>
    function playTrack(title, genre, src) {
      const player = document.getElementById('mainPlayer');
      const source = document.getElementById('audioSource');
      document.getElementById('currentTitle').textContent = title;
      document.getElementById('currentGenre').textContent = genre;
      source.src = src;
      player.load();
      player.play();
    }

    function filterGenre(genre) {
      const items = document.querySelectorAll('.item-music');
      const banner = document.getElementById('heroBanner');
      document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
      event.target.classList.add('active');

      if (genre === 'all') {
        banner.style.display = 'flex';
      } else {
        banner.style.display = 'none';
      }

      items.forEach(item => {
        if (genre === 'all' || item.classList.contains(genre)) {
          item.style.display = 'block';
        } else {
          item.style.display = 'none';
        }
      });
    }

    function searchMusic() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.item-music').forEach(item => {
        item.style.display = item.textContent.toLowerCase().includes(input) ? 'block' : 'none';
      });
    }

    function toggleLike(btn, event) {
      event.stopPropagation();
      btn.classList.toggle('liked');
    }

    function openModal() {
      document.getElementById('modalOverlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
    }

    function addMusic() {
      const title = document.getElementById('trackTitle').value;
      const genre = document.getElementById('trackGenre').value;
      const fileInput = document.getElementById('trackFile');

      if (!title || fileInput.files.length === 0) {
        alert('Remplis le titre et choisis un fichier audio !');
        return;
      }

      const audioUrl = URL.createObjectURL(fileInput.files[0]);
      const genreName = genre.toUpperCase();

      const newCard = document.createElement('div');
      newCard.className = `card item-music ${genre}`;
      newCard.onclick = () => playTrack(title, genreName, audioUrl);
      newCard.innerHTML = `
        <img src="https://via.placeholder.com/150/181818/1db954?text=${genreName}">
        <div class="card-title">${title}</div>
        <div class="card-genre">${genreName}</div>
        <div class="card-actions">
          <a href="${audioUrl}" download="${title}.mp3" class="btn-dl" onclick="event.stopPropagation()">Télécharger</a>
          <button class="btn-like" onclick="toggleLike(this, event)">♥</button>
        </div>
      `;

      document.getElementById('musicContainer').appendChild(newCard);
      closeModal();

      document.getElementById('trackTitle').value = '';
      fileInput.value = '';
    }
  </script>

</body>
</html>
