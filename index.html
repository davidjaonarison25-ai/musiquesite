<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passfoot 🎮 - Arcade Cyber Stadium</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 2.8rem;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.6), 0 0 30px rgba(56, 189, 248, 0.3);
    }

    header p {
      color: #94a3b8;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    /* Navigation des jeux Néon */
    .game-nav {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      background: #161e2e;
      padding: 8px;
      border-radius: 14px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .nav-btn {
      padding: 12px 24px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-weight: bold;
      font-size: 0.95rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-btn.active, .nav-btn:hover {
      background: #38bdf8;
      color: #0b0f19;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
    }

    /* Conteneur principal */
    .game-container {
      background: #161e2e;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 20px rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.2);
      max-width: 680px;
      width: 100%;
      text-align: center;
    }

    .game-section {
      display: none;
    }

    .game-section.active {
      display: block;
    }

    /* --- TABLEAU DES SCORES NÉON --- */
    .scoreboard {
      display: flex;
      justify-content: space-around;
      background: #0b0f19;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-weight: bold;
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
    }

    .scoreboard div {
      font-size: 1.05rem;
      color: #cbd5e1;
    }

    .scoreboard span {
      color: #38bdf8;
      font-size: 1.3rem;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
    }

    /* --- TERRAIN DE FOOTBAL REALISTE & NEON --- */
    .pitch {
      position: relative;
      width: 100%;
      height: 380px;
      background: repeating-linear-gradient(
        0deg,
        #15803d,
        #15803d 40px,
        #166534 40px,
        #166534 80px
      );
      border-radius: 16px;
      overflow: hidden;
      border: 3px solid #4ade80;
      box-shadow: 0 0 20px rgba(74, 222, 128, 0.4), inset 0 0 40px rgba(0, 0, 0, 0.5);
      cursor: crosshair;
    }

    /* Ligne de fond de court */
    .pitch-line-goal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.8);
    }

    /* Grande Surface de Réparation */
    .penalty-area {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 380px;
      height: 180px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-top: none;
    }

    /* Surface de But (6 mètres) */
    .goal-area {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 70px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-top: none;
    }

    /* Arc de cercle de la surface */
    .penalty-arc {
      position: absolute;
      top: 180px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 60px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 0 0 120px 120px;
      border-top: none;
    }

    /* Point de Penalty */
    .penalty-spot {
      position: absolute;
      top: 130px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 8px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px #ffffff;
    }

    /* Cage de But Réaliste avec Filet */
    .goal {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      height: 90px;
      border: 5px solid #ffffff;
      border-bottom: none;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
      background: repeating-linear-gradient(0deg, transparent, transparent 8px, rgba(255, 255, 255, 0.25) 8px, rgba(255, 255, 255, 0.25) 9px),
                  repeating-linear-gradient(90deg, transparent, transparent 8px, rgba(255, 255, 255, 0.25) 8px, rgba(255, 255, 255, 0.25) 9px);
      z-index: 2;
    }

    /* Gardien */
    .goalkeeper {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 42px;
      height: 52px;
      background: linear-gradient(to bottom, #ef4444, #991b1b);
      border: 2px solid #fca5a5;
      border-radius: 10px 10px 0 0;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.8);
      transition: all 0.25s ease-out;
      z-index: 3;
    }

    /* Ballon avec effet Néon */
    .ball {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 32px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 12px #ffffff, inset -4px -4px 0 #94a3b8;
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 4;
    }

    /* Message de Résultat Néon */
    .message {
      margin-top: 18px;
      font-size: 1.25rem;
      font-weight: bold;
      min-height: 35px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    /* --- BOUTONS D'ACTION NÉON --- */
    .btn-action {
      margin-top: 15px;
      padding: 12px 28px;
      background: #38bdf8;
      color: #0b0f19;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: #7dd3fc;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.9);
      transform: translateY(-2px);
    }

    /* --- QUIZ FOOT NÉON --- */
    .quiz-box {
      background: #0b0f19;
      padding: 22px;
      border-radius: 14px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .question {
      font-size: 1.25rem;
      margin-bottom: 22px;
      color: #f1f5f9;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .option-btn {
      padding: 14px;
      background: #1e293b;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .option-btn:hover {
      background: #334155;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    /* --- JONGLES NÉON --- */
    .juggling-area {
      height: 340px;
      background: #0b0f19;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(56, 189, 248, 0.2);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
    }

    .juggling-ball {
      position: absolute;
      width: 48px;
      height: 48px;
      background: white;
      border-radius: 50%;
      left: 50%;
      top: 60px;
      transform: translateX(-50%);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      user-select: none;
      box-shadow: 0 0 15px #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <h1>Passfoot 🎮</h1>
    <p>Cyber Arena</p>
  </header>

  <!-- Sélecteur de jeux -->
  <div class="game-nav">
    <button class="nav-btn active" onclick="switchGame('penalties', this)">⚽ Tir au But</button>
    <button class="nav-btn" onclick="switchGame('quiz', this)">🧠 Quiz Foot</button>
    <button class="nav-btn" onclick="switchGame('juggling', this)">🤹 Jongles</button>
  </div>

  <div class="game-container">

    <!-- JEU 1: TIR AU BUT AMÉLIORÉ -->
    <div id="penalties" class="game-section active">
      <div class="scoreboard">
        <div>Tirs: <span id="shots">0</span></div>
        <div>Buts: <span id="goals">0</span></div>
        <div>Arrêts: <span id="saves">0</span></div>
      </div>

      <div class="pitch" id="pitch">
        <!-- Lignes du Terrain -->
        <div class="pitch-line-goal"></div>
        <div class="penalty-area"></div>
        <div class="goal-area"></div>
        <div class="penalty-arc"></div>
        <div class="penalty-spot"></div>

        <!-- Cage et Acteurs -->
        <div class="goal" id="goal">
          <div class="goalkeeper" id="keeper"></div>
        </div>
        <div class="ball" id="ball"></div>
      </div>

      <div class="message" id="message">Clique sur le terrain pour ajuster ton tir !</div>
      <button class="btn-action" onclick="resetPenalties()">Réinitialiser</button>
    </div>

    <!-- JEU 2: QUIZ FOOT -->
    <div id="quiz" class="game-section">
      <div class="scoreboard">
        <div>Score Quiz: <span id="quiz-score">0</span></div>
      </div>
      <div class="quiz-box">
        <div class="question" id="quiz-q">Chargement de la question...</div>
        <div class="options-grid" id="quiz-options"></div>
      </div>
      <div class="message" id="quiz-msg"></div>
    </div>

    <!-- JEU 3: JONGLES -->
    <div id="juggling" class="game-section">
      <div class="scoreboard">
        <div>Jongles consécutifs: <span id="juggle-count">0</span></div>
        <div>Record: <span id="juggle-best">0</span></div>
      </div>
      <div class="juggling-area" id="juggle-area">
        <div class="juggling-ball" id="juggle-ball" onclick="bounceBall()">⚽</div>
      </div>
      <div class="message" id="juggle-msg">Clique sur le ballon avant qu'il ne touche le sol !</div>
    </div>

  </div>

  <script>
    // Système d'onglets
    function switchGame(gameId, btn) {
      document.querySelectorAll('.game-section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(gameId).classList.add('active');
      btn.classList.add('active');
      if(gameId === 'juggling') resetJuggling();
    }

    /* LOGIQUE 1: TIR AU BUT */
    const pitch = document.getElementById('pitch');
    const ball = document.getElementById('ball');
    const keeper = document.getElementById('keeper');
    const goal = document.getElementById('goal');
    let shots = 0, goals = 0, saves = 0, isShooting = false;

    pitch.addEventListener('click', (e) => {
      if (isShooting) return;
      const rect = pitch.getBoundingClientRect();
      shoot(e.clientX - rect.left, e.clientY - rect.top);
    });

    function shoot(targetX, targetY) {
      isShooting = true;
      shots++;
      document.getElementById('shots').textContent = shots;
      ball.style.left = `${targetX}px`;
      ball.style.top = `${targetY}px`;
      ball.style.transform = 'scale(0.65)';

      const keeperPositions = [20, 50, 80];
      const randomPos = keeperPositions[Math.floor(Math.random() * keeperPositions.length)];
      keeper.style.left = `${randomPos}%`;

      setTimeout(() => {
        const goalRect = goal.getBoundingClientRect();
        const pitchRect = pitch.getBoundingClientRect();
        const isInside = targetX >= (goalRect.left - pitchRect.left) && targetX <= (goalRect.right - pitchRect.left) && targetY >= (goalRect.top - pitchRect.top) && targetY <= (goalRect.bottom - pitchRect.top);
        const keeperX = (goalRect.width * (randomPos / 100)) + (goalRect.left - pitchRect.left);
        const isSaved = Math.abs(targetX - keeperX) < 45 && isInside;

        const msg = document.getElementById('message');
        if (isSaved) {
          saves++;
          document.getElementById('saves').textContent = saves;
          msg.textContent = "🖐️ ARRÊT DU GARDIEN !";
          msg.style.color = "#ef4444";
          msg.style.textShadow = "0 0 10px rgba(239, 68, 68, 0.8)";
        } else if (isInside) {
          goals++;
          document.getElementById('goals').textContent = goals;
          msg.textContent = "⚽ GOOOAL !!! EN PLEINE LUCARNE !";
          msg.style.color = "#4ade80";
          msg.style.textShadow = "0 0 10px rgba(74, 222, 128, 0.8)";
        } else {
          msg.textContent = "❌ À CÔTÉ !";
          msg.style.color = "#f59e0b";
          msg.style.textShadow = "0 0 10px rgba(245, 158, 11, 0.8)";
        }

        setTimeout(() => {
          ball.style.left = '50%';
          ball.style.top = '';
          ball.style.bottom = '25px';
          ball.style.transform = 'translateX(-50%) scale(1)';
          keeper.style.left = '50%';
          isShooting = false;
        }, 1200);
      }, 400);
    }

    function resetPenalties() {
      shots = goals = saves = 0;
      document.getElementById('shots').textContent = 0;
      document.getElementById('goals').textContent = 0;
      document.getElementById('saves').textContent = 0;
      document.getElementById('message').textContent = "Clique sur le terrain pour ajuster ton tir !";
      document.getElementById('message').style.color = "#f8fafc";
    }

    /* LOGIQUE 2: QUIZ FOOT (8 QUESTIONS) */
    const quizData = [
      { q: "Quel pays a remporté la Coupe du Monde 2022 ?", options: ["France", "Brésil", "Argentine", "Allemagne"], answer: 2 },
      { q: "Quel joueur possède le plus de Ballons d'Or ?", options: ["Ronaldo", "Messi", "Cruyff", "Zidane"], answer: 1 },
      { q: "Combien de temps dure un match de football réglementaire ?", options: ["80 min", "90 min", "100 min", "120 min"], answer: 1 },
      { q: "Quel pays a remporté la toute première Coupe du Monde en 1930 ?", options: ["Brésil", "Uruguay", "Italie", "Argentine"], answer: 1 },
      { q: "Quel club détient le record du plus grand nombre de Ligues des Champions ?", options: ["AC Milan", "FC Barcelone", "Real Madrid", "Bayern Munich"], answer: 2 },
      { q: "Qui détient le record du but le plus rapide de l'histoire de la Coupe du Monde (11 secondes) ?", options: ["Hakan Şükür", "Pelé", "Kylian Mbappé", "Ronaldo Nazário"], answer: 0 },
      { q: "En quelle année le premier Ballon d'Or a-t-il été attribué ?", options: ["1950", "1956", "1962", "1970"], answer: 1 },
      { q: "Quel joueur est le seul à avoir remporté 3 Coupes du Monde en tant que joueur ?", options: ["Maradona", "Zinedine Zidane", "Pelé", "Manoel Garrincha"], answer: 2 }
    ];
    let currentQ = 0, quizScore = 0;

    function loadQuiz() {
      const q = quizData[currentQ];
      document.getElementById('quiz-q').textContent = q.q;
      const optGrid = document.getElementById('quiz-options');
      optGrid.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.onclick = () => checkQuiz(idx);
        optGrid.appendChild(btn);
      });
    }

    function checkQuiz(selected) {
      const msg = document.getElementById('quiz-msg');
      if(selected === quizData[currentQ].answer) {
        quizScore += 10;
        document.getElementById('quiz-score').textContent = quizScore;
        msg.textContent = "✅ Bonne réponse !";
        msg.style.color = "#4ade80";
      } else {
        msg.textContent = "❌ Mauvaise réponse !";
        msg.style.color = "#ef4444";
      }
      currentQ = (currentQ + 1) % quizData.length;
      setTimeout(() => { msg.textContent = ''; loadQuiz(); }, 1000);
    }
    loadQuiz();

    /* LOGIQUE 3: JONGLES */
    let juggles = 0, bestJuggle = 0, ballY = 60, ballSpeed = 2, juggleInterval;
    const jBall = document.getElementById('juggle-ball');

    function bounceBall() {
      juggles++;
      document.getElementById('juggle-count').textContent = juggles;
      if(juggles > bestJuggle) {
        bestJuggle = juggles;
        document.getElementById('juggle-best').textContent = bestJuggle;
      }
      ballY = 40;
      ballSpeed = -4;
    }

    function gameLoopJuggling() {
      ballSpeed += 0.2;
      ballY += ballSpeed;
      if(ballY > 280) {
        document.getElementById('juggle-msg').textContent = "💥 Perdu ! Le ballon a touché le sol.";
        resetJuggling();
        return;
      }
      jBall.style.top = `${ballY}px`;
    }

    function resetJuggling() {
      clearInterval(juggleInterval);
      juggles = 0;
      document.getElementById('juggle-count').textContent = 0;
      ballY = 60;
      ballSpeed = 0;
      jBall.style.top = '60px';
      juggleInterval = setInterval(gameLoopJuggling, 20);
    }
  </script>
</body>
</html>
