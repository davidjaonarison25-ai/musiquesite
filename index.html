<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passfoot 🎮 - Puppet Soccer Ultra 1v1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: #040d1a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    
    h1 { color: #00f0ff; text-shadow: 0 0 12px #00f0ff; margin-bottom: 8px; text-transform: uppercase; font-size: 2rem; }

    /* MENU SELECTION */
    #char-select-screen {
      background: #0a192f; border: 2px solid #00f0ff; box-shadow: 0 0 25px rgba(0,240,255,0.4);
      border-radius: 16px; padding: 25px; text-align: center; width: 800px;
    }
    .char-grid { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
    .char-card {
      background: #0f233d; border: 2px solid #1e40af; border-radius: 12px; padding: 15px; width: 170px;
      cursor: pointer; transition: all 0.2s;
    }
    .char-card:hover, .char-card.selected { border-color: #00f0ff; box-shadow: 0 0 15px #00f0ff; transform: translateY(-4px); }
    .char-avatar { font-size: 3.5rem; margin-bottom: 8px; }
    .btn-start {
      background: #00f0ff; color: #040d1a; border: none; padding: 10px 30px; font-size: 1.2rem;
      font-weight: bold; border-radius: 20px; cursor: pointer; box-shadow: 0 0 15px #00f0ff; text-transform: uppercase;
    }

    /* ECRAN DE JEU */
    #game-container { display: none; flex-direction: column; align-items: center; }

    .scoreboard {
      display: flex; justify-content: space-between; align-items: center; width: 800px; background: #0a192f;
      padding: 10px 20px; border: 2px solid #00f0ff; border-bottom: none; border-radius: 12px 12px 0 0;
      font-weight: bold; color: #00f0ff;
    }

    .power-bar-container { width: 120px; height: 16px; background: #081627; border: 1px solid #00f0ff; border-radius: 8px; overflow: hidden; margin-top: 4px; }
    .power-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #f59e0b, #ef4444); transition: width 0.1s; }

    canvas {
      background: linear-gradient(180deg, #0b132b 0%, #1c2541 70%, #064e3b 70%, #022c22 100%);
      border: 2px solid #00f0ff; box-shadow: 0 0 25px rgba(0,240,255,0.3); border-radius: 0 0 12px 12px;
    }

    .controls-hint { margin-top: 12px; color: #94a3b8; font-size: 0.85rem; text-align: center; }
    .controls-hint span { color: #00f0ff; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Puppet Soccer 1v1 ⚽</h1>

  <!-- ECRAN SELECTION PERSONNAGE -->
  <div id="char-select-screen">
    <h2 style="color:#00f0ff">Choisis ton Joueur</h2>
    <div class="char-grid">
      <div class="char-card selected" id="card-0" onclick="selectChar(0)">
        <div class="char-avatar">⚡</div>
        <h3>Speedy</h3>
        <p style="font-size:0.75rem; color:#94a3b8; margin-top:4px;">Tir Éclair</p>
      </div>
      <div class="char-card" id="card-1" onclick="selectChar(1)">
        <div class="char-avatar">🔥</div>
        <h3>Striker</h3>
        <p style="font-size:0.75rem; color:#94a3b8; margin-top:4px;">Tir Enflammé</p>
      </div>
      <div class="char-card" id="card-2" onclick="selectChar(2)">
        <div class="char-avatar">❄️</div>
        <h3>Freezer</h3>
        <p style="font-size:0.75rem; color:#94a3b8; margin-top:4px;">Gel Adversaire</p>
      </div>
    </div>
    <button class="btn-start" id="start-btn">Lancer le Match !</button>
  </div>

  <!-- JEU -->
  <div id="game-container">
    <div class="scoreboard">
      <div>
        <span style="color:#38bdf8" id="p1-name">J1</span>: <span id="score1">0</span>
        <div class="power-bar-container"><div class="power-bar-fill" id="p1-power"></div></div>
      </div>
      <div style="color: #f59e0b; font-size:1.6rem">⏱️ <span id="timer">60</span>s</div>
      <div style="text-align:right;">
        <span style="color:#ef4444">IA</span>: <span id="score2">0</span>
        <div class="power-bar-container"><div class="power-bar-fill" id="p2-power"></div></div>
      </div>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div class="controls-hint">
      Contrôles : <span>← / →</span> Déplacer | <span>↑</span> Sauter | <span>ESPACE</span> Tirer | <span>K</span> Super-Pouvoir (Jauge pleine)
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      const characters = [
        { name: "Speedy", color: "#38bdf8", power: "speed" },
        { name: "Striker", color: "#f59e0b", power: "fire" },
        { name: "Freezer", color: "#a855f7", power: "freeze" }
      ];

      let selectedCharIdx = 0;
      let score1 = 0, score2 = 0, timeLeft = 60;
      let gameOver = false, timerInt;

      const gravity = 0.45;
      const groundY = 350;

      const p1 = { x: 150, y: 250, vx: 0, vy: 0, size: 28, headSize: 22, color: '#38bdf8', isGrounded: false, powerProgress: 0, isFrozen: false };
      const p2 = { x: 610, y: 250, vx: 0, vy: 0, size: 28, headSize: 22, color: '#ef4444', isGrounded: false, powerProgress: 0, isFrozen: false };
      const ball = { x: 400, y: 150, vx: 0, vy: 0, radius: 14, bounce: 0.75, isFire: false };

      const keys = {};
      window.addEventListener('keydown', e => keys[e.code] = true);
      window.addEventListener('keyup', e => keys[e.code] = false);

      window.selectChar = function(idx) {
        selectedCharIdx = idx;
        document.querySelectorAll('.char-card').forEach((c, i) => {
          c.classList.toggle('selected', i === idx);
        });
      };

      document.getElementById('start-btn').addEventListener('click', () => {
        document.getElementById('char-select-screen').style.display = 'none';
        document.getElementById('game-container').style.display = 'flex';
        p1.color = characters[selectedCharIdx].color;
        document.getElementById('p1-name').textContent = characters[selectedCharIdx].name;

        timerInt = setInterval(() => {
          if(timeLeft > 0 && !gameOver) {
            timeLeft--;
            document.getElementById('timer').textContent = timeLeft;
          } else if(timeLeft === 0) {
            gameOver = true;
            alert(`Fin du match ! Score : ${score1} - ${score2}`);
            clearInterval(timerInt);
          }
        }, 1000);

        gameLoop();
      });

      function resetPositions() {
        p1.x = 150; p1.y = 250; p1.vx = 0; p1.vy = 0; p1.isFrozen = false;
        p2.x = 610; p2.y = 250; p2.vx = 0; p2.vy = 0; p2.isFrozen = false;
        ball.x = 400; ball.y = 150; ball.vx = 0; ball.vy = 0; ball.isFire = false;
      }

      function triggerPower(player, opponent) {
        if(player.powerProgress < 100) return;
        player.powerProgress = 0;

        const charPower = (player === p1) ? characters[selectedCharIdx].power : "fire";

        if(charPower === "fire") {
          ball.isFire = true;
          ball.vx = (player === p1) ? 18 : -18;
          ball.vy = -4;
        } else if(charPower === "freeze") {
          opponent.isFrozen = true;
          setTimeout(() => opponent.isFrozen = false, 2500);
        } else if(charPower === "speed") {
          player.vx = (player === p1) ? 15 : -15;
        }
      }

      function update() {
        if(gameOver) return;

        if(!p1.isFrozen) {
          if (keys['ArrowLeft']) p1.vx = -5;
          else if (keys['ArrowRight']) p1.vx = 5;
          else p1.vx = 0;

          if (keys['ArrowUp'] && p1.isGrounded) { p1.vy = -11; p1.isGrounded = false; }
          if (keys['KeyK']) triggerPower(p1, p2);
        } else p1.vx = 0;

        if(!p2.isFrozen) {
          if (ball.x > 350) {
            if (ball.x > p2.x + 10) p2.vx = 3.5;
            else if (ball.x < p2.x - 10) p2.vx = -3.5;
            else p2.vx = 0;

            if (ball.y < p2.y - 30 && p2.isGrounded && Math.abs(ball.x - p2.x) < 40) {
              p2.vy = -10; p2.isGrounded = false;
            }
          } else {
            if (p2.x < 620) p2.vx = 3; else p2.vx = 0;
          }
          if(p2.powerProgress >= 100 && Math.abs(ball.x - p2.x) < 100) triggerPower(p2, p1);
        } else p2.vx = 0;

        [p1, p2].forEach(p => {
          p.vy += gravity; p.x += p.vx; p.y += p.vy;
          if (p.y + p.size >= groundY) { p.y = groundY - p.size; p.vy = 0; p.isGrounded = true; }
          if (p.x - p.size < 0) p.x = p.size;
          if (p.x + p.size > canvas.width) p.x = canvas.width - p.size;

          if(p.powerProgress < 100) p.powerProgress += 0.15;
        });

        document.getElementById('p1-power').style.width = `${p1.powerProgress}%`;
        document.getElementById('p2-power').style.width = `${p2.powerProgress}%`;

        ball.vy += gravity * 0.7; ball.x += ball.vx; ball.y += ball.vy;
        ball.vx *= 0.99;

        if (ball.y + ball.radius >= groundY) { ball.y = groundY - ball.radius; ball.vy = -ball.vy * ball.bounce; }
        if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) ball.vx = -ball.vx * ball.bounce;

        [p1, p2].forEach(p => {
          let dx = ball.x - p.x;
          let dy = ball.y - (p.y - p.headSize);
          let dist = Math.hypot(dx, dy);
          let minDist = ball.radius + p.size;

          if (dist < minDist) {
            let angle = Math.atan2(dy, dx);
            let power = ball.isFire ? 14 : 9;
            ball.vx = Math.cos(angle) * power + p.vx * 0.5;
            ball.vy = Math.sin(angle) * power + p.vy * 0.5;
          }
        });

        if (keys['Space'] && !p1.isFrozen) {
          if (Math.hypot(ball.x - p1.x, ball.y - p1.y) < 65) {
            ball.vx = 12; ball.vy = -6;
          }
        }

        if (ball.y > 230 && ball.y <= groundY) {
          if (ball.x - ball.radius <= 50) { score2++; document.getElementById('score2').textContent = score2; resetPositions(); }
          if (ball.x + ball.radius >= 750) { score1++; document.getElementById('score1').textContent = score1; resetPositions(); }
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.lineWidth = 4; ctx.strokeStyle = '#00f0ff';
        ctx.strokeRect(0, 220, 50, 130);
        ctx.strokeRect(750, 220, 50, 130);

        [p1, p2].forEach(p => {
          ctx.fillStyle = p.isFrozen ? '#93c5fd' : p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();

          ctx.fillStyle = p.isFrozen ? '#bfdbfe' : '#ffdbac';
          ctx.beginPath(); ctx.arc(p.x, p.y - p.headSize, p.headSize, 0, Math.PI * 2); ctx.fill();

          ctx.fillStyle = '#000';
          let eyeOffset = p === p1 ? 6 : -6;
          ctx.beginPath(); ctx.arc(p.x + eyeOffset, p.y - p.headSize - 2, 3, 0, Math.PI * 2); ctx.fill();
        });

        ctx.fillStyle = ball.isFire ? '#ef4444' : '#ffffff';
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = ball.isFire ? '#f59e0b' : '#000'; ctx.lineWidth = 2; ctx.stroke();
      }

      function gameLoop() {
        update();
        draw();
        if(!gameOver) requestAnimationFrame(gameLoop);
      }
    });
  </script>
</body>
</html>
