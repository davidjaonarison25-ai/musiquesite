<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passfoot - Mini-Jeux</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 2.5rem;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Conteneur principal du jeu */
    .game-container {
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      max-width: 650px;
      width: 100%;
      text-align: center;
    }

    /* Tableau des scores */
    .scoreboard {
      display: flex;
      justify-content: space-around;
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .score-item span {
      color: #38bdf8;
    }

    /* Terrain et Cage */
    .pitch {
      position: relative;
      width: 100%;
      height: 350px;
      background: linear-gradient(to bottom, #15803d, #166534);
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid #22c55e;
      cursor: crosshair;
    }

    /* La cage de but */
    .goal {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      height: 110px;
      border: 6px solid #ffffff;
      border-bottom: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 10px,
        rgba(255, 255, 255, 0.15) 10px,
        rgba(255, 255, 255, 0.15) 11px
      ),
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 10px,
        rgba(255, 255, 255, 0.15) 10px,
        rgba(255, 255, 255, 0.15) 11px
      );
    }

    /* Le gardien */
    .goalkeeper {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 50px;
      background-color: #ef4444;
      border-radius: 8px 8px 0 0;
      transition: all 0.25s ease-out;
    }

    /* Le ballon */
    .ball {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 30px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: inset -4px -4px 0 #94a3b8;
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Message de résultat */
    .message {
      margin-top: 15px;
      font-size: 1.3rem;
      font-weight: bold;
      min-height: 30px;
    }

    .btn-reset {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-reset:hover {
      background-color: #7dd3fc;
    }
  </style>
</head>
<body>

  <header>
    <h1>Passfoot 🎮</h1>
    <p>Mini-Jeu : Tir au But</p>
  </header>

  <div class="game-container">
    <div class="scoreboard">
      <div class="score-item">Tirs: <span id="shots">0</span></div>
      <div class="score-item">Buts: <span id="goals">0</span></div>
      <div class="score-item">Arrêts: <span id="saves">0</span></div>
    </div>

    <div class="pitch" id="pitch">
      <div class="goal" id="goal">
        <div class="goalkeeper" id="keeper"></div>
      </div>
      <div class="ball" id="ball"></div>
    </div>

    <div class="message" id="message">Clique sur le terrain pour tirer !</div>
    <button class="btn-reset" onclick="resetGame()">Réinitialiser le score</button>
  </div>

  <script>
    const pitch = document.getElementById('pitch');
    const ball = document.getElementById('ball');
    const keeper = document.getElementById('keeper');
    const goal = document.getElementById('goal');

    const shotsEl = document.getElementById('shots');
    const goalsEl = document.getElementById('goals');
    const savesEl = document.getElementById('saves');
    const messageEl = document.getElementById('message');

    let shots = 0;
    let goals = 0;
    let saves = 0;
    let isShooting = false;

    pitch.addEventListener('click', (e) => {
      if (isShooting) return;

      const rect = pitch.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      // Déclencher le tir
      shoot(clickX, clickY);
    });

    function shoot(targetX, targetY) {
      isShooting = true;
      shots++;
      shotsEl.textContent = shots;

      // Positionner le ballon à l'endroit cliqué
      ball.style.left = `${targetX}px`;
      ball.style.top = `${targetY}px`;
      ball.style.transform = 'scale(0.65)';

      // Déplacement aléatoire du gardien
      const keeperPositions = [20, 50, 80]; // Gauche, Centre, Droite (en %)
      const randomPos = keeperPositions[Math.floor(Math.random() * keeperPositions.length)];
      keeper.style.left = `${randomPos}%`;

      // Vérification des collisions après l'animation
      setTimeout(() => {
        checkResult(targetX, targetY, randomPos);
      }, 400);
    }

    function checkResult(targetX, targetY, keeperPosPercent) {
      const goalRect = goal.getBoundingClientRect();
      const pitchRect = pitch.getBoundingClientRect();

      // Limites de la cage par rapport au terrain
      const goalLeft = goalRect.left - pitchRect.left;
      const goalRight = goalRect.right - pitchRect.left;
      const goalTop = goalRect.top - pitchRect.top;
      const goalBottom = goalRect.bottom - pitchRect.top;

      // Le tir est-il cadré ?
      const isInsideGoal = targetX >= goalLeft && targetX <= goalRight &&
                           targetY >= goalTop && targetY <= goalBottom;

      // Position du gardien en pixels
      const keeperX = (goalRect.width * (keeperPosPercent / 100)) + goalLeft;
      const isSaved = Math.abs(targetX - keeperX) < 45 && isInsideGoal;

      if (isSaved) {
        saves++;
        savesEl.textContent = saves;
        messageEl.textContent = "🖐️ Arrêt du gardien !";
        messageEl.style.color = "#ef4444";
      } else if (isInsideGoal) {
        goals++;
        goalsEl.textContent = goals;
        messageEl.textContent = "⚽ BUT !!! Magnifique frappe !";
        messageEl.style.color = "#22c55e";
      } else {
        messageEl.textContent = "❌ À côté ! Ajuste ta frappe.";
        messageEl.style.color = "#f59e0b";
      }

      // Réinitialisation du ballon pour le prochain tir
      setTimeout(() => {
        ball.style.left = '50%';
        ball.style.top = '';
        ball.style.bottom = '20px';
        ball.style.transform = 'translateX(-50%) scale(1)';
        keeper.style.left = '50%';
        isShooting = false;
      }, 1200);
    }

    function resetGame() {
      shots = 0;
      goals = 0;
      saves = 0;
      shotsEl.textContent = 0;
      goalsEl.textContent = 0;
      savesEl.textContent = 0;
      messageEl.textContent = "Clique sur le terrain pour tirer !";
      messageEl.style.color = "#f8fafc";
    }
  </script>
</body>
</html>
